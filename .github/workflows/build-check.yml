name: Build check (Jekyll)

on:
  push:
    branches: [ acad-homepage ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Report output
        run: |
          echo "built files:"; ls -la ./_site | head -20
          test -f ./_site/index.html && echo "OK: index.html generated"
